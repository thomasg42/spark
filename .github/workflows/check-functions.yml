# Type-checks the Supabase Edge Functions (Deno) including the Anthropic SDK calls.
# Runs separately so a Deno toolchain hiccup never blocks publishing the site.
name: Check Edge Functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/check-functions.yml"]
  workflow_dispatch:

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check
        run: bash scripts/check-functions.sh
